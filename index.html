<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">&#9654;</div>
                <h1>Teleprompter</h1>
                <span class="logo-badge">PRO</span>
            </div>
        </div>

        <div class="sidebar-content">
            <div class="form-group">
                <label class="form-label">Guion</label>
                <textarea id="guion" placeholder="Pega tu guion aqui...&#10;&#10;PERSONAJE: Dialogo aqui...&#10;ESCENA 1: Descripcion"></textarea>
            </div>

            <div class="form-group">
                <div class="search-box">
                    <input type="text" id="search-editor" class="search-input" placeholder="Buscar en el guion...">
                    <button class="btn btn-secondary" id="search-editor-btn" style="padding:10px 14px; flex:none;">&#128269;</button>
                    <span id="search-editor-count" class="search-count"></span>
                </div>
            </div>

            <div class="controls-grid">
                <div class="control-card">
                    <div class="control-header">
                        <span class="form-label">Velocidad</span>
                        <span class="control-value" id="vel-val">3</span>
                    </div>
                    <input type="range" id="vel" min="1" max="15" value="3">
                </div>
                <div class="control-card">
                    <div class="control-header">
                        <span class="form-label">Tamano</span>
                        <span class="control-value" id="size-val">22</span>
                    </div>
                    <input type="range" id="size" min="14" max="100" value="22">
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-lines">0</div>
                    <div class="stat-label">Lineas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-chars">0</div>
                    <div class="stat-label">Personajes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-words">0</div>
                    <div class="stat-label">Palabras</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-time">0</div>
                    <div class="stat-label">Min</div>
                </div>
            </div>

            <div class="characters-section">
                <label class="form-label">Personajes</label>
                <div id="pjs-list" class="characters-list">
                    <div class="empty-state">Pega un guion para comenzar</div>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="btn-row">
                <button class="btn btn-secondary" id="btn-example">Ejemplo</button>
                <button class="btn btn-secondary" id="btn-copy">Copiar</button>
            </div>
            <button class="btn btn-primary" id="btn-start" disabled>
                <span>&#9654;</span> Iniciar Teleprompter
            </button>
        </div>
    </div>

    <div class="teleprompter" id="tp">
        <div class="tp-guide"></div>

        <div class="tp-header">
            <div class="tp-header-left">
                <button class="tp-btn" id="btn-back">&#9664; Volver</button>
                <span class="tp-timer" id="tp-timer">00:00</span>
            </div>
            <div class="tp-header-right">
                <button class="tp-btn" id="btn-fullscreen" title="Pantalla completa (F)">&#9974; Pantalla completa</button>
                <select class="tp-select" id="sel-pj">
                    <option value="todos">Ver todos</option>
                </select>
            </div>
        </div>

        <div class="tp-content" id="tp-text"></div>

        <div class="tp-footer">
            <span class="tp-label">Velocidad</span>
            <button class="tp-ctrl" id="btn-slower">&#8722;</button>
            <button class="tp-play" id="btn-play">&#9654;</button>
            <button class="tp-ctrl" id="btn-faster">+</button>
            <div class="tp-sep"></div>
            <span class="tp-label">Letra</span>
            <button class="tp-ctrl" id="btn-smaller">A&#8722;</button>
            <button class="tp-ctrl" id="btn-bigger">A+</button>
        </div>

        <div class="tp-toast" id="tp-msg"></div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
